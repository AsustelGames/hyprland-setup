[mgr]
show_hidden = true
sort_by = "size"
ratio = [0, 4, 4]
sort_dir_first = true
linemode = "size_and_btime"
show_symlink = true

[preview]
wrap = "yes"


[opener]
edit = [
  { run = 'sh -c ''[ -w "$1" ] && exec nvim "$@" || exec sudoedit -- "$@"'' sh "$@"', block = true }
  { "mpv %s", block = true }
]

