# Theme: Grassland
# By: AsustelGames

font:
  terminal:
    family: "MartianMono Nerd Font"
    size: 9.5
  rofi:
    family: "MartianMono Nerd Font"
    size: 12
    icon_size: 30
  waybar:
    family: "MartianMono Nerd Font Mono"
    size: 15

colors:
  gui:
    main:
      background: "#182728"
      foreground: "#F9F5F4"
      primary: "#CAD277"
      secondary: "#A2B057"

    extra:
      # Black
      color0: "#173626"
      color8: "#214c36"

      # Red
      color1: "#903d3d"
      color9: "#ac4a4a"

      # Green
      color2: "#5b903d"
      color10: "#6ead49"

      # Yello
      color3: "#908e3d"
      color11: "#acab4a"

      # Blue
      color4: "#3d7b90"
      color12: "#4a94ac"

      # Pink
      color5: "#813d90"
      color13: "#9a4aac"

      # Cyan
      color6: "#3d9089"
      color14: "#4aaca4"

      # White
      color7: "#bfcbc5"
      color15: "#d6deda"

  terminal:
    main:
      background: "#182728"
      foreground: "#F9F5F4"
      primary: "#CAD277"
      secondary: "#A2B057"

    extra:
      # Black
      color0: "#173626"
      color8: "#214c36"

      # Red
      color1: "#903d3d"
      color9: "#ac4a4a"

      # Green
      color2: "#5b903d"
      color10: "#6ead49"

      # Yello
      color3: "#908e3d"
      color11: "#acab4a"

      # Blue
      color4: "#3d7b90"
      color12: "#4a94ac"

      # Pink
      color5: "#813d90"
      color13: "#9a4aac"

      # Cyan
      color6: "#3d9089"
      color14: "#4aaca4"

      # White
      color7: "#bfcbc5"
      color15: "#d6deda"

decoration:
  border_radius: 8
  rounding_power: 3
  border_size: 3
  gaps_in: 4
  gaps_out: 10

  active_opacity: 1.0
  inactive_opacity: 0.85

  dim_inactive: "true"
  dim_strength: 0.1

  shadow:
    enabled: "true"
    range: 5
    render_power: 3

  blur:
    enabled: "true"
    size: 3
    passes: 5
    noise: 0.07
    vibrancy: 0.23
    vibrancy_darkness: 1
    brightness: 1.2

    terminal:
      active: 0.9
      inactive: 0.8

misc:
  scripts:
    main:
      menu: "$HOME/.config/scripts/menu.sh"
      kitty: "$HOME/.config/scripts/kitty.sh"

    waybar:
      cava: "$HOME/.config/scripts/waybar/cava.sh"
      power_profiles: "$HOME/.config/scripts/waybar/power-profiles.sh" 
