general {
    gaps_in = 6
    gaps_out = 10

    border_size = 3

    col.active_border = rgba(7C7C7CFF)
    col.inactive_border = rgba(626262FF)
}

decoration {
    rounding = 0
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0


    shadow {
        enabled = true
        range = 5
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
    }
}


windowrule = opacity 1.0 0.9, match:class kitty
