general {
    gaps_in = 6
    gaps_out = 10

    border_size = 3

    col.active_border = rgba(7C7C7CFF)
    col.inactive_border = rgba(626262FF)
}

decoration {
    rounding = 0
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 0.85

    dim_inactive = true
    dim_strength = 0.3

    shadow {
        enabled = true
        range = 5
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 4
        noise = 0.03
        vibrancy = 0.19
        vibrancy_darkness = 1
        brightness = 1.1
        popups = true
    }
}


windowrule = opacity 0.9 0.8, match:class kitty

layerrule = blur on, ignore_alpha 0.1, match:namespace rofi
layerrule = blur on, ignore_alpha 0.7, match:namespace waybar
