general {
    gaps_in = 6
    gaps_out = 12

    border_size = 3

    col.active_border = rgba(AD5295FF) rgba(3E3996FF) 45deg
    col.inactive_border = rgba(1586DFFF) rgba(BEECF0FF)
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 3
	    noise = 0.03
        vibrancy = 0.1696
        popups = true
    }
}


windowrule = opacity 0.95 0.8, match:class kitty

layerrule = blur on, ignore_alpha 0.3, match:namespace rofi
layerrule = blur on, ignore_alpha 0.7, match:namespace waybar
