general {
   gaps_in = 4
   gaps_out = 10

   border_size = 3

   col.active_border = rgba(CAD277FF)
   col.inactive_border = rgba(A2B057FF)
}

decoration {
   rounding = 8
   rounding_power = 3

   active_opacity = 1
   inactive_opacity = 0.85

   dim_inactive = true
   dim_strength = 0.1

   shadow {
      enabled = true
      range = 5
      render_power = 3
      color = rgba(173626ee)
   }

   blur {
      enabled = true
      size = 3
      passes = 5
      noise = 0.07
      vibrancy = 0.23
      vibrancy_darkness = 1
      brightness = 1.2
      popups = true
      special = true
   }
}


windowrule = opacity 0.9 0.8, match:class kitty

layerrule = blur on, ignore_alpha 0.1, match:namespace rofi
layerrule = blur on, ignore_alpha 0.7, match:namespace waybar
