general {
   gaps_in = 4
   gaps_out = 10

   border_size = 3

   col.active_border = rgba(FDAE96FF)
   col.inactive_border = rgba(EC8175FF)
}

decoration {
   rounding = 15
   rounding_power = 3

   active_opacity = 1
   inactive_opacity = 0.85

   dim_inactive = true
   dim_strength = 0.1

   shadow {
      enabled = true
      range = 5
      render_power = 3
      color = rgba(2E3436ee)
   }

   blur {
      enabled = true
      size = 5
      passes = 4
      noise = 0.06
      vibrancy = 0.19
      vibrancy_darkness = 1
      brightness = 1.1
      popups = true
      special = true
   }
}


windowrule = opacity 0.9 0.8, match:class kitty

layerrule = blur on, ignore_alpha 0.1, match:namespace rofi
layerrule = blur on, ignore_alpha 0.7, match:namespace waybar
