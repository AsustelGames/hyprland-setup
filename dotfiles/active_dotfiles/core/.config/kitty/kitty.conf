# vim:fileencoding=utf-8:foldmethod=marker

include current-theme.conf


# Settings
shell zsh

detect_urls yes

confirm_os_window_close 0
allow_remote_control yes

focus_follows_mouse yes
tab_title_template {index}


# Looks
font_size 9.5

window_padding_width 4 4 4 4

cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.05 0.3
cursor_blink_interval 0

window_border_width 2
inactive_text_alpha 0.5


# Tab keybindings
map super+alt+h previous_window
map super+alt+j new_window
map super+alt+k close_window
map super+alt+l next_window

map super+alt+n move_window_backward
map super+alt+m move_window_forward

map super+alt+u next_layout
map super+alt+i start_resizing_window


# Split window keybindings
map super+shift+h previous_tab
map super+shift+j new_tab
map super+shift+k close_tab
map super+shift+l next_tab

map super+shift+n move_tab_backward
map super+shift+m move_tab_forward

map super+shift+u set_tab_title
