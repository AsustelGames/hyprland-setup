$menuPath = ~/.config/scripts/menu.sh
$kittyScriptPath = ~/.config/scripts/kitty.sh

$shell = bash


$terminal = $shell $kittyScriptPath --session session.conf
$terminalNormal = kitty
$browser = brave
$fileManager = $shell $kittyScriptPath --session yazi-session.conf yazi
$fileManagerNormal = $terminalNormal yazi 

$menu = $shell $menuPath
$appMenu = $shell $menuPath -a

$screenshotMenu = $shell $menuPath -s
$screenshotToClipboardMenu = $shell $menuPath -S

$clipboardMenu = $shell $menuPath -c
$clipboardWipe = $shell $menuPath -w

$themeMenu = $shell $menuPath -t

$powerMenu = $shell $menuPath -p
